services:
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-demodemo}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  graphiti-mcp-dev:
    build:
      context: ..  # Build from parent directory to access graphiti_core
      dockerfile: mcp_server/Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-demodemo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - PATH=/root/.local/bin:${PATH}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      # VS Code integration
      - USE_VSCODE_MODELS=${USE_VSCODE_MODELS:-true}
      # Gemini support
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    # Development volumes - live reload local changes
    volumes:
      - ../graphiti_core:/workspace/graphiti_core  # Read-write for development
      - ./graphiti_mcp_server.py:/workspace/mcp_server/graphiti_mcp_server.py  # Live server updates
      - ./.env:/workspace/mcp_server/.env:ro  # Environment file
    ports:
      - "8122:8000" # Expose the MCP server via HTTP for SSE transport
    command: ["uv", "run", "graphiti_mcp_server.py", "--transport", "sse"]
    # Enable development mode
    develop:
      watch:
        - action: sync
          path: ../graphiti_core
          target: /workspace/graphiti_core
        - action: sync
          path: ./graphiti_mcp_server.py
          target: /workspace/mcp_server/graphiti_mcp_server.py
        - action: rebuild
          path: ./pyproject.toml

volumes:
  neo4j_data:
  neo4j_logs: