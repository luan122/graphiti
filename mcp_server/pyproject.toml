[project]
name = "mcp-server"
version = "0.4.0"
description = "Graphiti MCP Server"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "mcp>=1.5.0",
    "openai>=1.68.2",
    "azure-identity>=1.21.0",
    # Core dependencies from graphiti-core for local development
    "anthropic>=0.31.2",
    "google-generativeai>=0.8.3",
    "google-genai>=1.36.0",
    "groq>=0.9.0", 
    "neo4j>=5.26.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "diskcache>=5.6.3",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "posthog>=3.0.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["graphiti_mcp_server"]

[tool.uv]
# Enable development dependencies and local package resolution  
dev-dependencies = [
    "pytest>=7.0.0", 
    "pytest-asyncio>=0.21.0",
    "aiohttp>=3.8.0",  # For container testing
]
